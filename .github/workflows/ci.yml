name: CI

on:
  pull_request:
  push:
    branches: [ main, ci/**, feature/** ]

jobs:
  build-test:
    name: build & test (Go)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          fmt_out=$(gofmt -s -l .)
          if [ -n "$fmt_out" ]; then
            echo "Files not formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Run tests
        run: go test -v ./...
